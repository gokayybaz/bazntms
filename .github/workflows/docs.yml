name: Docs

# Docusaurus sitesini GitHub Pages'e yayınlar (Faz 7.4).
# Site adresi: https://gokayybaz.github.io/bazntms/
# İlk çalıştırmada repo Settings → Pages → Source = "GitHub Actions" olmalı.

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'frontend/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            docs-site/package-lock.json
            frontend/package-lock.json

      - name: Install (docs-site)
        working-directory: docs-site
        run: npm ci

      - name: Build (docs-site)
        working-directory: docs-site
        run: npm run build

      # Canlı demo: backend'siz statik frontend build'i (--mode demo) →
      # /bazntms/demo/ altında yayınlanır. Docusaurus build'inin ÜSTÜNE
      # kopyalanır; web/dist'e dokunmaz (vite.config outDir = web/demo).
      - name: Install (frontend)
        working-directory: frontend
        run: npm ci

      - name: Build demo dashboard
        working-directory: frontend
        run: npm run build:demo

      - name: Stage demo under docs-site/build/demo
        run: |
          rm -rf docs-site/build/demo
          mkdir -p docs-site/build/demo
          cp -r web/demo/. docs-site/build/demo/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
