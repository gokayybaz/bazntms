name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runs: ubuntu-latest }
          - { goos: linux, goarch: arm64, runs: ubuntu-24.04-arm }
          - { goos: darwin, goarch: amd64, runs: macos-latest }
          - { goos: darwin, goarch: arm64, runs: macos-latest }
          - { goos: windows, goarch: amd64, runs: windows-latest }
    runs-on: ${{ matrix.runs }}
    defaults:
      run:
        shell: ${{ matrix.goos == 'windows' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libpcap (linux)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install toolchain (windows)
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false
          install: >-
            git
            unzip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-go

      - uses: actions/setup-go@v5
        if: matrix.goos != 'windows'
        with:
          go-version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Npcap SDK (windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          curl.exe -L -o npcap-sdk.zip https://npcap.com/dist/npcap-sdk-1.13.zip
          Expand-Archive -Force npcap-sdk.zip C:\npcap-sdk

      - name: Build frontend (windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build frontend
        if: matrix.goos != 'windows'
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build binaries
        env:
          CGO_ENABLED: '1'
          CGO_CFLAGS: ${{ matrix.goos == 'windows' && '-I/c/npcap-sdk/Include' || '' }}
          CGO_LDFLAGS: ${{ matrix.goos == 'windows' && '-L/c/npcap-sdk/Lib/x64' || '' }}
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          EXT="${{ matrix.goos == 'windows' && '.exe' || '' }}"
          LDFLAGS="-s -w -X github.com/gokayybaz/bazntms/internal/version.Version=$VERSION"
          go build -trimpath -ldflags "$LDFLAGS" \
            -o "bazntms-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/bazntms-hub
          go build -trimpath -ldflags "$LDFLAGS" \
            -o "bazntms-agent-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/bazntms-agent
          go build -trimpath -ldflags "$LDFLAGS" \
            -o "bazntmsctl-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/bazntmsctl

      # macOS pkg installer (Faz 7.3; yalnizca darwin runner'larda)
      - name: Build macOS pkg
        if: matrix.goos == 'darwin'
        run: |
          chmod +x deploy/macos/build-pkg.sh deploy/macos/postinstall
          VERSION="${GITHUB_REF_NAME:-dev}"
          deploy/macos/build-pkg.sh \
            "bazntms-agent-${{ matrix.goos }}-${{ matrix.goarch }}" \
            "bazntms-agent-${{ matrix.goarch }}.pkg" \
            "${VERSION#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: bazntms-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bazntms-*
            bazntmsctl-*
            !bazntms-agent.yml

  packages:
    name: Packages (deb/rpm/msi)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Install tooling (nfpm, wixl)
        run: |
          # ubuntu 24.04'te wixl msitools'tan ayrilmis durumda
          sudo apt-get update && sudo apt-get install -y msitools wixl
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build deb/rpm (amd64 + arm64)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          chmod +x deploy/nfpm/postinstall.sh deploy/nfpm/postremove.sh
          for arch in amd64 arm64; do
            export ARCH="$arch" VERSION
            # nfpm config dosyasinda env genisletme yapmaz; once envsubst
            for fmt in deb rpm; do
              envsubst '$ARCH $VERSION' < deploy/nfpm/agent.yaml > nfpm-expanded.yaml
              nfpm package -p "$fmt" -f nfpm-expanded.yaml \
                -t "bazntms-agent-${arch}.${fmt}"
            done
          done
          rm -f nfpm-expanded.yaml

      - name: Build MSI (windows-amd64)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          wixl -v -a x64 -o bazntms-agent-amd64.msi \
            -D VERSION="$VERSION" \
            -D EXE=bazntms-agent-windows-amd64.exe \
            -D CONF=deploy/config/bazntms-agent.yml.example \
            deploy/msi/bazntms-agent.wxs

      - uses: actions/upload-artifact@v4
        with:
          name: bazntms-packages
          path: |
            bazntms-*.deb
            bazntms-*.rpm
            bazntms-*.msi
            !bazntms-agent.yml

  supply-chain:
    name: Supply chain (SBOM, scan, sign)
    needs: [build, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign keyless imza
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: SBOM (syft, SPDX)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: bazntms-sbom.spdx.json
          upload-artifact: true

      - name: Trivy taramasi (CRITICAL bloklar)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Cosign keyless imzasi
        uses: sigstore/cosign-installer@v3

      - name: Artifact'lari imzala
        run: |
          for f in bazntms-* bazntmsctl-*; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --output-signature "$f.sig" --bundle "$f.bundle" "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bazntms-signatures
          path: |
            bazntms-*.sig
            bazntms-*.bundle
            bazntmsctl-*.sig
            bazntmsctl-*.bundle

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # not: glob bazntms-sbom.spdx.json'i da kapsar; dosyayi ikinci kez
          # acikca vermek ayni asset'i iki kez yuklemeye calisir ve cakilir
          # bazntmsctl-* "bazntms-" prefix'i icermedigi icin ayri verilmeli
          gh release create "${GITHUB_REF_NAME}" \
            bazntms-* bazntmsctl-* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "bazNTMS ${GITHUB_REF_NAME}" \
            --generate-notes
