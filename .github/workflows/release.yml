name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Etiket sürümü ile depo içindeki sürüm alanları tutarlı mı — maintainer
  # RELEASE-RUNBOOK §2'deki bump adımını atladıysa release burada durur
  # (workflow_dispatch'te atlanır; skip'lenen job needs'i bloklamaz).
  preflight:
    name: Sürüm tutarlılığı
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chart.yaml + CHANGELOG etiketle eşleşiyor mu
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          for k in version appVersion; do
            got=$(sed -n -E "s/^$k: *\"?([^\"]+)\"?.*/\1/p" deploy/helm/bazntms/Chart.yaml)
            [ "$got" = "$tag" ] || { echo "::error::Chart.yaml $k='$got' ama etiket='$tag' — RELEASE-RUNBOOK §2"; exit 1; }
          done
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "::error::CHANGELOG.md'de '## [$tag]' bölümü yok"; exit 1; }
          echo "sürüm alanları tutarlı: $tag"

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: preflight
    # preflight tag'de çalışır (fail → burada dur), dispatch'te skip'lenir (devam)
    if: ${{ always() && needs.preflight.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runs: ubuntu-latest }
          - { goos: linux, goarch: arm64, runs: ubuntu-24.04-arm }
          - { goos: darwin, goarch: amd64, runs: macos-latest }
          - { goos: darwin, goarch: arm64, runs: macos-latest }
          - { goos: windows, goarch: amd64, runs: windows-latest }
    runs-on: ${{ matrix.runs }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install libpcap (linux)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      # gopacket/pcap Windows'ta cgo KULLANMAZ (wpcap.dll'i syscall ile
      # calisma zamaninda dinamik yukler, bkz. pcap_windows.go) ve repoda
      # baska hic cgo kodu yok (modernc.org/sqlite de saf Go) — bu yuzden
      # Windows derlemesi Npcap SDK/mingw toolchain GEREKTIRMEZ. Npcap'in
      # KENDISI yalnizca calisma zamaninda, agent `-pcap` bayragiyla
      # baslatilirsa (surec bazli trafik atfi) gerekir — bkz. docs/TROUBLESHOOTING.md
      - name: Build binaries
        env:
          CGO_ENABLED: ${{ matrix.goos == 'windows' && '0' || '1' }}
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          EXT="${{ matrix.goos == 'windows' && '.exe' || '' }}"
          LDFLAGS="-s -w -X github.com/gokayybaz/bazntms/internal/version.Version=$VERSION"
          go build -trimpath -ldflags "$LDFLAGS" \
            -o "bazntms-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/bazntms-hub
          go build -trimpath -ldflags "$LDFLAGS" \
            -o "bazntms-agent-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/bazntms-agent
          go build -trimpath -ldflags "$LDFLAGS" \
            -o "bazntmsctl-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/bazntmsctl

      # macOS pkg installer (Faz 7.3; yalnizca darwin runner'larda)
      - name: Build macOS pkg
        if: matrix.goos == 'darwin'
        run: |
          chmod +x deploy/macos/build-pkg.sh deploy/macos/postinstall
          VERSION="${GITHUB_REF_NAME:-dev}"
          deploy/macos/build-pkg.sh \
            "bazntms-agent-${{ matrix.goos }}-${{ matrix.goarch }}" \
            "bazntms-agent-${{ matrix.goarch }}.pkg" \
            "${VERSION#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: bazntms-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bazntms-*
            bazntmsctl-*
            !bazntms-agent.yml

  packages:
    name: Packages (deb/rpm)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Install tooling (nfpm)
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build deb/rpm (amd64 + arm64)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          chmod +x deploy/nfpm/postinstall.sh deploy/nfpm/postremove.sh
          for arch in amd64 arm64; do
            export ARCH="$arch" VERSION
            # nfpm config dosyasinda env genisletme yapmaz; once envsubst
            for fmt in deb rpm; do
              envsubst '$ARCH $VERSION' < deploy/nfpm/agent.yaml > nfpm-expanded.yaml
              nfpm package -p "$fmt" -f nfpm-expanded.yaml \
                -t "bazntms-agent-${arch}.${fmt}"
            done
          done
          rm -f nfpm-expanded.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: bazntms-packages
          path: |
            bazntms-*.deb
            bazntms-*.rpm
            !bazntms-agent.yml

  msi:
    name: Packages (msi)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # v6/v7'de "Open Source Maintenance Fee" EULA'si zorunlu kilindigi
      # icin BILEREK 4.0.5'e pinlendi (bkz. error WIX7015) — sessizce kabul
      # etmek yerine son ucretsiz major surumde kaliniyor
      - name: WiX Toolset v4 kurulumu
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add --global WixToolset.UI.wixext/4.0.5

      - name: MSI derle (windows-amd64)
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v',''
          wix build -arch x64 -o bazntms-agent-amd64.msi `
            -d VERSION=$version `
            -d EXE=bazntms-agent-windows-amd64.exe `
            -d CONF=deploy\config\bazntms-agent.yml.example `
            -ext WixToolset.UI.wixext `
            deploy\msi\bazntms-agent.wxs

      - uses: actions/upload-artifact@v4
        with:
          name: bazntms-msi
          path: bazntms-*.msi

  images:
    name: Konteyner imajı — derle/tara/push (${{ matrix.component }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # ghcr push
      id-token: write      # provenance attestation
      attestations: write  # SLSA build provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: hub, dockerfile: deploy/Dockerfile.hub }
          - { component: agent, dockerfile: deploy/Dockerfile.agent }
    steps:
      - uses: actions/checkout@v4

      # amd64 + arm64: arm64 QEMU emülasyonuyla derlenir (cgo + npm — yavaş
      # ama gha cache ile ilk çalıştırmadan sonra hızlanır). Çok yavaşlarsa
      # mimari başına native runner + `docker manifest create`'e bölünebilir.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: ghcr.io oturumu
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiket + OCI metaverisi
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bazntms-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      # Önce yerel amd64 imaj: Trivy taraması + (hub) duman testi bunun
      # üstünde çalışır ve push'u KAPIYA alır — CRITICAL CVE veya çökük imaj
      # asla ghcr'a çıkmaz. arm64 katmanları push adımında derlenir (cache
      # paylaşımlı, çoğu hit).
      - name: Yerel amd64 imaj (tarama + duman testi)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: bazntms-${{ matrix.component }}:scan
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.component }}

      - name: Trivy imaj taraması (CRITICAL bloklar)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bazntms-${{ matrix.component }}:scan
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Duman testi (hub)
        if: matrix.component == 'hub'
        run: .github/scripts/image_smoke_test.sh bazntms-hub:scan ${{ github.ref_name }}

      - name: Derle + (yalnız etikette) push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: İmaj build provenance (SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/bazntms-${{ matrix.component }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  chart:
    name: Helm chart (paketle + OCI push)
    needs: preflight
    if: ${{ always() && needs.preflight.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # oci://ghcr.io/<owner>/charts
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Paketle
        run: helm package deploy/helm/bazntms -d dist
      - name: OCI push (yalnız etikette)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
          helm push dist/bazntms-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  supply-chain:
    name: Supply chain (SBOM, scan, sign, provenance)
    needs: [build, packages, msi, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # cosign keyless imza + attestation
      attestations: write # SLSA build provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: SBOM (syft, SPDX)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: bazntms-sbom.spdx.json
          upload-artifact: true

      - name: Trivy taramasi (CRITICAL bloklar)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # SLSA build provenance — cosign imzasından ÖNCE ki .sig/.bundle
      # dosyaları özneye girmesin. Yalnız binary + paketler (SBOM hariç).
      - name: Build provenance (binary + paketler)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            bazntms-linux-*
            bazntms-darwin-*
            bazntms-windows-*
            bazntms-agent-*
            bazntmsctl-*

      - name: Cosign keyless imzasi
        uses: sigstore/cosign-installer@v3

      - name: Artifact'lari imzala
        run: |
          for f in bazntms-* bazntmsctl-*; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --output-signature "$f.sig" --bundle "$f.bundle" "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bazntms-signatures
          path: |
            bazntms-*.sig
            bazntms-*.bundle
            bazntmsctl-*.sig
            bazntmsctl-*.bundle

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, supply-chain, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # .github/release-footer.md için
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # not: glob bazntms-sbom.spdx.json'i da kapsar; dosyayi ikinci kez
          # acikca vermek ayni asset'i iki kez yuklemeye calisir ve cakilir
          # bazntmsctl-* "bazntms-" prefix'i icermedigi icin ayri verilmeli
          gh release create "$V" \
            bazntms-* bazntmsctl-* \
            --repo "$GITHUB_REPOSITORY" \
            --title "bazNTMS $V" \
            --generate-notes
          # üretilen commit listesinin altına doğrulama talimatları
          body=$(gh release view "$V" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          footer=$(sed -e "s|__REPO__|$GITHUB_REPOSITORY|g" \
                       -e "s|__OWNER__|$OWNER|g" \
                       -e "s|__V__|${V#v}|g" .github/release-footer.md)
          printf '%s\n\n%s\n' "$body" "$footer" > /tmp/notes.md
          gh release edit "$V" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/notes.md
