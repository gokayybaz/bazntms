name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runs: ubuntu-latest }
          - { goos: linux, goarch: arm64, runs: ubuntu-24.04-arm }
          - { goos: darwin, goarch: amd64, runs: macos-latest }
          - { goos: darwin, goarch: arm64, runs: macos-latest }
          - { goos: windows, goarch: amd64, runs: windows-latest }
    runs-on: ${{ matrix.runs }}
    defaults:
      run:
        shell: ${{ matrix.goos == 'windows' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libpcap (linux)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install toolchain (windows)
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false
          install: >-
            git
            unzip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-go

      - uses: actions/setup-go@v5
        if: matrix.goos != 'windows'
        with:
          go-version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Npcap SDK (windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          curl.exe -L -o npcap-sdk.zip https://npcap.com/dist/npcap-sdk-1.13.zip
          Expand-Archive -Force npcap-sdk.zip C:\npcap-sdk

      - name: Build frontend (windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build frontend
        if: matrix.goos != 'windows'
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build binaries
        env:
          CGO_ENABLED: '1'
          CGO_CFLAGS: ${{ matrix.goos == 'windows' && '-I/c/npcap-sdk/Include' || '' }}
          CGO_LDFLAGS: ${{ matrix.goos == 'windows' && '-L/c/npcap-sdk/Lib/x64' || '' }}
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          EXT="${{ matrix.goos == 'windows' && '.exe' || '' }}"
          LDFLAGS="-s -w -X github.com/gokayybaz/bazntms/internal/version.Version=$VERSION"
          go build -trimpath -ldflags "$LDFLAGS" \
            -o "bazntms-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/bazntms-hub
          go build -trimpath -ldflags "$LDFLAGS" \
            -o "bazntms-agent-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/bazntms-agent

      - uses: actions/upload-artifact@v4
        with:
          name: bazntms-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bazntms-*
            !bazntms-agent.yml

  supply-chain:
    name: Supply chain (SBOM, scan, sign)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign keyless imza
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: SBOM (syft, SPDX)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: bazntms-sbom.spdx.json
          upload-artifact: true

      - name: Trivy taramasi (CRITICAL bloklar)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Cosign keyless imzasi
        uses: sigstore/cosign-installer@v3

      - name: Artifact'lari imzala
        run: |
          for f in bazntms-*; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --output-signature "$f.sig" --bundle "$f.bundle" "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bazntms-signatures
          path: |
            bazntms-*.sig
            bazntms-*.bundle

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            bazntms-* bazntms-sbom.spdx.json \
            --repo "${GITHUB_REPOSITORY}" \
            --title "bazNTMS ${GITHUB_REF_NAME}" \
            --generate-notes
