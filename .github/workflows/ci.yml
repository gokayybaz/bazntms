name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: "soak-short süresi (dk)"
        default: "20"

jobs:
  frontend:
    name: Frontend (build + lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build

  linux-macos:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install libpcap (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Format check (gofmt)
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Bu dosyalar gofmt'lenmemis (gofmt -w ile duzeltin):"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # -race yalnizca linux job'unda: cgo/C toolchain gerektirir, calisma
      # suresini ~3x artirir; veri yarisi platformdan bagimsiz oldugu icin
      # tek platformda kosmak yeterli.
      - name: Test (linux, race dedektoru)
        if: runner.os == 'Linux'
        run: go test ./... -race -count=1

      - name: Test (macos)
        if: runner.os == 'macOS'
        run: go test ./... -count=1

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # v2.12.2 (Go 1.26 ile derli) `setup-go` "stable" = Go 1.27 altında
          # go/types'ta panik atıyor (initFiles). Go 1.27 ile derlenmiş sürüm.
          version: v2.13.2

  ebpf-generate:
    # Faz 20 S20.4: internal/agent/bpf/attrprog_bpfel.{go,o} committed'dir →
    # `go build` clang gerektirmez. Bu iş, commit'lenen çıktının attr.c +
    # vmlinux.h ile güncel olduğunu SABİT araç zinciriyle doğrular (make
    # generate-bpf ile aynı imaj + clang-14 → byte-tekrarlanabilir .o).
    name: eBPF üretim güncelliği
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: go generate (sabit araç zinciri)
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            golang:1.26-bookworm bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq clang-14 llvm libbpf-dev
              cd internal/agent/bpf && BPF2GO_CC=clang-14 go generate ./...
              chown -R "$HOST_UID:$HOST_GID" .'

      - name: drift kontrolü
        run: git diff --exit-code -- internal/agent/bpf/

  ebpf-smoke:
    # Faz 20 S20.5: canlı eBPF yükleme + fentry attach + akış haritası okuma.
    # ubuntu-latest çekirdeği BTF taşır; sudo (root) fentry/CAP_BPF için yeter.
    # Test, yükleme başarısızsa atlar (yeşil kalır) — asıl hedef regresyon ağı.
    name: eBPF atıf (canlı yükleme)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: eBPF entegrasyon testi (root)
        run: sudo -E "$(command -v go)" test ./internal/agent/ -run TestEBPF -v -count=1

  helm:
    name: Helm chart (lint + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: kubeconform kur
        run: |
          curl -sSL -o kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kc.tar.gz && sudo install kubeconform /usr/local/bin/

      - name: helm lint
        run: helm lint deploy/helm/bazntms

      # varsayılan (yalnız hub) + her şey açık (agent DaemonSet + Ingress):
      # ikisi de şema-geçerli k8s manifesti üretmeli
      - name: helm template + kubeconform
        run: |
          set -euo pipefail
          KV=1.29.0
          helm template rel deploy/helm/bazntms \
            | kubeconform -strict -summary -kubernetes-version "$KV"
          helm template rel deploy/helm/bazntms \
            --set agent.enabled=true --set ingress.enabled=true --set auth.password=x \
            | kubeconform -strict -summary -kubernetes-version "$KV"

  db-upgrade-test:
    # Faz 13 S13.4: bir onceki release'in semasiyla olusturulan bir DB'yi
    # HEAD binary'si hatasiz yukseltiyor mu? Onceki tag'i bir git worktree'ye
    # cikar, ESKI kod ile semayi kur (SQLite + Postgres/TimescaleDB), sonra
    # HEAD kodu ile ac + migrasyon + Ping. Migrasyon runner'i (internal/store/
    # migrate.go) veya bir migrasyon dosyasi mevcut kurulumlari kirarsa burada
    # yakalanir.
    name: DB upgrade test (onceki release -> HEAD)
    runs-on: ubuntu-latest
    services:
      timescale:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: bazntms
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bazntms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bazntms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Onceki release ile eski semali DB uret
        env:
          PGDSN: postgres://bazntms:test@localhost:5432/bazntms?sslmode=disable
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 HEAD)
          echo "onceki release: $PREV"
          git worktree add --detach /tmp/bazntms-prev "$PREV"
          mkdir -p /tmp/bazntms-prev/tools/dbcheck
          cp tools/dbcheck/main.go /tmp/bazntms-prev/tools/dbcheck/main.go
          cd /tmp/bazntms-prev
          go run ./tools/dbcheck -db /tmp/legacy.db
          go run ./tools/dbcheck -db "$PGDSN"

      - name: HEAD binary'si eski DB'yi yukseltiyor mu (SQLite + Postgres)
        env:
          PGDSN: postgres://bazntms:test@localhost:5432/bazntms?sslmode=disable
        run: |
          set -euo pipefail
          go run ./tools/dbcheck -db /tmp/legacy.db -ping
          go run ./tools/dbcheck -db "$PGDSN" -ping

  installer-smoke-test:
    # 2026-09-01'de bulunan 2 gercek hatanin (RPM %post stdin'i asla
    # terminale bagli gostermiyor; /dev/tty duzeltmesinin ilk hali
    # otomasyon senaryosunu bozuyordu — bkz. commit 3f0b24e) otomatik
    # regresyon testi. deploy/nfpm/postinstall.sh her degistiginde
    # gercek Docker container'larinda (gercek pty ile) deb+rpm kurulumu
    # dogrulanir; bir dahaki benzer hata elle kesfedilmeden ilk push'ta
    # yakalanir.
    name: Installer smoke test (deb/rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install tooling (nfpm, pexpect, envsubst)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          pip3 install --break-system-packages pexpect
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base

      - name: Test paketleri olustur (gercek postinstall.sh, sahte binary)
        run: |
          chmod +x deploy/nfpm/postinstall.sh deploy/nfpm/postremove.sh
          printf '#!/bin/sh\necho ok\n' > bazntms-agent-linux-amd64
          chmod +x bazntms-agent-linux-amd64
          ARCH=amd64 VERSION=0.0.0-smoketest envsubst '$ARCH $VERSION' \
            < deploy/nfpm/agent.yaml > /tmp/nfpm-smoketest.yaml
          nfpm package -p deb -f /tmp/nfpm-smoketest.yaml -t /tmp/smoketest.deb
          nfpm package -p rpm -f /tmp/nfpm-smoketest.yaml -t /tmp/smoketest.rpm

      - name: Duman testi (deb+rpm × interaktif/otomasyon, gercek pty)
        env:
          DEB_PKG: /tmp/smoketest.deb
          RPM_PKG: /tmp/smoketest.rpm
        run: python3 .github/scripts/installer_smoke_test.py

  scale-smoke-test:
    # installer-smoke-test'ten ayri amac: paketleme degil, deploy/docker-compose.scale.yml'nin
    # (N x hub-ingest + 2 x hub-controller + nginx lb + TimescaleDB + NATS
    # JetStream + gercek agent'lar) MIMARI regresyonlarini yakalar — LB
    # routing, JetStream'in ingest replikalari arasinda kuyruk paylasimi,
    # agent verisinin gercekten dashboard API'sine ulasmasi ve Faz 15 HA:
    # bir hub-controller olunce panel + paylasimli oturum ayakta kalmali.
    name: Scale stack smoke test (docker-compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ölçek yığınını ayağa kaldır
        run: |
          docker compose -f deploy/docker-compose.scale.yml up -d --build --wait --wait-timeout 360

      - name: Duman testi (giriş + agent filosu + telemetri + HA failover)
        run: python3 .github/scripts/scale_smoke_test.py

      - name: Loglar (başarısızlıkta teşhis için)
        if: failure()
        run: docker compose -f deploy/docker-compose.scale.yml logs --tail=200

      - name: Temizlik
        if: always()
        run: docker compose -f deploy/docker-compose.scale.yml down -v

  soak-short:
    # Faz 21 S21.13: sızıntı avı — yalnızca elle (workflow_dispatch). Ölçek
    # yığını + --profile obs, kısa birleşik yük, canlı heap/goroutine/FD
    # platosu kontrolü. Tam 8 saat soak operatör görevidir (docs/perf/).
    name: Soak (short — leak check)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Yığın + gözlemlenebilirlik
        run: |
          docker compose -f deploy/docker-compose.scale.yml up -d --build --wait --wait-timeout 360
          docker compose -f deploy/docker-compose.scale.yml --profile obs up -d
          sleep 15
      - name: Soak
        env:
          DURATION: ${{ github.event.inputs.soak_minutes || 20 }}m
          SAMPLE_EVERY: "60"
          AGENTS: "800"
          FLOW_RATE: "12000"
          DEVICES: "200"
        run: scripts/soak.sh
      - name: Rapor
        if: always()
        run: cat docs/perf/soak-*.md || true
      - name: Temizlik
        if: always()
        run: docker compose -f deploy/docker-compose.scale.yml --profile obs down -v

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  windows:
    # CGO_ENABLED=0: gopacket/pcap Windows'ta cgo KULLANMAZ (wpcap.dll'i
    # runtime'da syscall ile yukler) ve ETW tuketicisi (etw_windows.go)
    # de saf Go advapi32 syscall'lari — repoda hic cgo yok. msys2/mingw
    # toolchain, Npcap SDK gerekmez. Bu job go vet + go test; struct
    # duzeni TestETWLayout ile GERCEK Windows arac zincirinde dogrulanir
    # (ETW oturum yasam dongusu elle, bkz. RELEASE-RUNBOOK §2b).
    name: Test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        env:
          CGO_ENABLED: 0
        run: |
          go version
          go vet ./...
          go test ./... -count=1
