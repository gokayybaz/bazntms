components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: nm_session
    bearerAuth:
      type: http
      scheme: bearer
      description: Login token'ı (`token`) veya entegrasyon API token'ı (`bnt_...`) ya da agent token'ı
    mtlsAuth:
      type: mutualTLS
      description: Hub `-tls` ile çalışırken agent istemci sertifikası
  parameters:
    minutes:
      name: minutes
      in: query
      schema: { type: integer, default: 60 }
      description: Geriye dönük pencere (dakika)
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 50 }
    agentId:
      name: agent_id
      in: query
      schema: { type: integer, default: 0 }
      description: 0 = filo geneli
    idPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
  responses:
    Unauthorized:
      description: Oturum gerekli
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              auth_required: { type: boolean }
    Forbidden:
      description: Yetki yetersiz (RBAC) veya site kapsamı dışında
    NotFound:
      description: Bulunamadı (veya site kapsamı dışında)
    RateLimited:
      description: Çok fazla başarısız deneme
      headers:
        Retry-After:
          schema: { type: integer }
  schemas:
    TelemetryBatch:
      type: object
      properties:
        ts: { type: integer }
        interfaces:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              rx_bytes: { type: integer }
              tx_bytes: { type: integer }
              rx_packets: { type: integer }
              tx_packets: { type: integer }
        connections:
          type: array
          items:
            type: object
            properties:
              proto: { type: string }
              local_addr: { type: string }
              remote_addr: { type: string }
              status: { type: string }
              pid: { type: integer }
              process: { type: string }
        process_traffic:
          type: array
          items: { type: object }
        l7:
          type: array
          items: { type: object }
        dns:
          type: array
          items: { type: object }
        flows:
          type: array
          items: { type: object }
    Agent:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        site: { type: string }
        online: { type: boolean }
        last_seen: { type: integer }
        version: { type: string }
        remote_ip: { type: string }
        conns: { type: integer }
        rates:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              rx_bps: { type: number }
              tx_bps: { type: number }
              pps: { type: number }
    Device:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        host: { type: string }
        kind: { type: string }
        site: { type: string }
        snmp_version: { type: integer }
        poll_seconds: { type: integer }
        enabled: { type: boolean }
        sys_name: { type: string }
        sys_descr: { type: string }
        last_poll: { type: integer }
        last_error: { type: string }
    DeviceCreate:
      type: object
      required: [name, host, kind]
      properties:
        name: { type: string }
        host: { type: string }
        kind: { type: string, enum: [switch, router, firewall, ap, server, other] }
        site: { type: string }
        vendor: { type: string, description: "boş = jenerik SNMP; 'fortigate' = FortiOS REST" }
        snmp_version: { type: integer, enum: [2, 3] }
        community: { type: string }
        v3_user: { type: string }
        v3_auth_proto: { type: string }
        v3_auth_pass: { type: string }
        v3_priv_proto: { type: string }
        v3_priv_pass: { type: string }
        api_url: { type: string }
        api_token: { type: string }
        api_verify_tls: { type: boolean }
        vdom: { type: string }
        poll_seconds: { type: integer }
    Flow:
      type: object
      properties:
        ts: { type: integer }
        device: { type: string }
        src: { type: string }
        dst: { type: string }
        src_port: { type: integer }
        dst_port: { type: integer }
        proto: { type: string }
        packets: { type: integer }
        octets: { type: integer }
