      responses:
        "200": { description: Tutanak dizisi }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [compliance]
      summary: İnceleme tutanağı ekle (yetki:admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [log, access] }
                period: { type: string }
                notes: { type: string }
                finding: { type: string }
      responses:
        "200": { description: Eklendi }
        "403": { $ref: "#/components/responses/Forbidden" }

