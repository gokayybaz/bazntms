# bazNTMS agent — nfpm paket tanimi (Faz 7.3)
# Kullanim (CI):
#   ARCH=amd64 VERSION=0.2.0 nfpm package -p deb \
#     -f deploy/nfpm/agent.yaml -t dist/bazntms-agent.deb
name: "bazntms-agent"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
section: "net"
priority: "extra"
maintainer: "gokayybaz"
description: |
  bazNTMS agent — network traffic telemetry daemon.
  Süreç bazlı trafik atfı, bağlantı envanteri ve offline kuyruk.
vendor: "bazNTMS"
homepage: "https://github.com/gokayybaz/bazntms"
license: "MIT"

contents:
  - src: "./bazntms-agent-linux-${ARCH}"
    dst: "/usr/local/bin/bazntms-agent"
  - src: "./deploy/systemd/bazntms-agent.service"
    dst: "/usr/lib/systemd/system/bazntms-agent.service"
  - src: "./deploy/config/bazntms-agent.yml.example"
    dst: "/etc/bazntms/agent.yml.example"
    type: "config|noreplace"

scripts:
  postinstall: ./deploy/nfpm/postinstall.sh
  postremove: ./deploy/nfpm/postremove.sh
