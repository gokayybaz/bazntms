{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "bazntms.fullname" . }}-agent
  labels:
    {{- include "bazntms.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bazntms.name" . }}-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "bazntms.name" . }}-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: agent
    spec:
      hostNetwork: {{ .Values.agent.hostNetwork }}
      dnsPolicy: {{ if .Values.agent.hostNetwork }}ClusterFirstWithHostNet{{ else }}ClusterFirst{{ end }}
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          args:
            - "-hub-url"
            - "http://{{ include "bazntms.fullname" . }}:{{ .Values.service.port }}"
            - "-site"
            - {{ .Values.agent.site | quote }}
            - "-name"
            - "$(POD_NAME)"
            - "-state"
            - "/var/lib/bazntms/agent.state.json"
            - "-enroll-token"
            - "$(ENROLL_TOKEN)"
            {{- if .Values.agent.update.enabled }}
            - "-update-enabled"
            - "-update-channel"
            - {{ .Values.agent.update.channel | quote }}
            {{- if .Values.agent.update.publicKey }}
            - "-update-key"
            - {{ .Values.agent.update.publicKey | quote }}
            {{- end }}
            - "-update-interval"
            - {{ .Values.agent.update.intervalHours | quote }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.agent.existingSecret }}
            - name: ENROLL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agent.existingSecret }}
                  key: {{ .Values.agent.existingSecretKey }}
            {{- else }}
            - name: ENROLL_TOKEN
              value: {{ .Values.enrollToken | quote }}
            {{- end }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/bazntms
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: state
          hostPath:
            path: /var/lib/bazntms
            type: DirectoryOrCreate
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
