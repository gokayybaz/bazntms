# bazNTMS — ingest havuzu yük dengeleyici (k8s Service karşılığı)
#
# Docker iç DNS'i (127.0.0.11) ile hub-ingest replikalarını dinamik çözer;
# `--scale hub-ingest=N` ile eklenen yeni replikalar 5 sn içinde havuza girer.
# Agent API'si oturumsuz (enrollment token) olduğu için yapışkanlık gerekmez;
# panolar bellek-içi oturum kullandığından hub-controller'a doğrudan bağlanır.
#
# İki dinleyici:
#   :8081  L7 HTTP proxy — düz HTTP agent trafiği (varsayılan)
#   :8443  L4 TCP passthrough — mTLS agent trafiği. nginx TLS'i SONLANDIRMAZ;
#          TLS el sıkışması (istemci sertifikası dahil) hub-ingest'te biter.
#          docker-compose.scale-mtls.yml overlay'iyle kullanılır.

events {}

# L4 (TCP) passthrough: agent karşılıklı TLS için — proxy TLS'i açmamalı
stream {
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 8443;
    set $ingest_tcp hub-ingest:8080;
    proxy_pass $ingest_tcp;
    proxy_connect_timeout 5s;
    proxy_timeout 3600s;
  }
}

http {
  resolver 127.0.0.11 valid=5s ipv6=off;

  # WebSocket (canlı akış) için Connection başlığı
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8081;

    location / {
      set $ingest http://hub-ingest:8080;
      proxy_pass $ingest;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
