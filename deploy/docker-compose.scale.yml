# bazNTMS — ölçek mimarisi (Kubernetes olmadan, docker compose ile; Faz 4.4)
#
# deploy/helm/bazntms'in aynaladığı üretim topolojisi (Faz 15 — HA):
#   N × hub-ingest     salt ingest replikaları (capture/alerts/poller kapalı);
#                      NATS JetStream durable "store-writer" tüketiciyi
#                      paylaşarak paralel yazar (replika ekleyince ölçeklenir)
#   2 × hub-controller panel + uyarı + poller + UDP alıcıları. -session-store=db
#                      ile oturumlar paylaşımlı; -alerts/-poller Postgres
#                      advisory-lock lider-seçimli (yalnız biri değerlendirir).
#                      Biri ölünce nginx diğerine yönlendirir — kesinti yok.
#   lb (nginx)         :8080 panel havuzu + :8081 agent ingest havuzu (k8s
#                      Service karşılığı; Docker iç DNS'i ile dinamik upstream)
#   TimescaleDB + NATS JetStream
#
# Kullanım:
#   docker compose -f deploy/docker-compose.scale.yml up --build
#
# Ingest replika sayısını değiştirme:
#   docker compose -f deploy/docker-compose.scale.yml up -d --scale hub-ingest=4
#
# Sentetik filo yükü (opsiyonel):
#   docker compose -f deploy/docker-compose.scale.yml --profile loadgen up -d loadgen
#
# Uçlar:
#   dashboard  → http://localhost:8080  (lb → hub-controller havuzu; oturumlar
#                paylaşımlı DB'de, bir replika ölünce oturum düşmez)
#   agent API  → http://localhost:8081  (lb → hub-ingest havuzu; agent'lar
#                oturum kullanmaz, enrollment token ile çalışır)

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: bazntms
      POSTGRES_PASSWORD: bazntms
      POSTGRES_DB: bazntms
    volumes:
      - tsdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazntms -d bazntms"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- kontrolcü: panel + uyarı + poller + cihaz alıcıları (2 replika, HA) ---
  # Faz 15: -session-store=db ile oturumlar paylaşımlı; -alerts/-poller Postgres
  # advisory-lock ile lider-seçimli (yalnız bir replika değerlendirir). Panel
  # trafiği nginx `dashboard` upstream'i üzerinden dağıtılır; bir replika ölünce
  # kesinti yok. NetFlow/syslog UDP alıcıları her replikada çalışır (bkz.
  # docs/decisions/0005): nginx `lb` stream{} bloğu her datagram'ı TEK replikaya
  # yönlendirir (k8s Service karşılığı), kuyruk store-writer'da tekilleştirir.
  # Cihazlar nginx'in yayınladığı loopback portlarına ulaşır (lb.ports +
  # deploy/scripts/mac-udp-relay.sh).
  hub-controller:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.hub
    command:
      - "-capture=false" # paket yakalama yalnızca host'taki agent'larda anlamlı
      - "-agent-pcap" # agent'ların surec bazli atif icin pcap yapmasina izin ver (politika)
      - "-session-store"
      - "db" # A4: paylaşımlı oturum tablosu — panel HA
      - "-flow-port"
      - "2055"
      - "-flow-exporter"
      - "${ROUTER_IP:-192.168.1.1}"
      - "-poll-interval"
      - "30"
      - "-syslog-port"
      - "5514"
      - "-ioc-file"
      - "/etc/bazntms/ioc.txt"
      - "-enroll-token"
      - "scale-enroll-token"
    # /data kalıcı: vault.key. Volume olmadan her recreate yeni master key üretir
    # → DB'deki AES-GCM şifreli cihaz kimlikleri çözülemez. İki replika AYNI
    # named volume'u paylaşır (vault.key ortak).
    volumes:
      - ctldata:/data
      - ./ioc-demo.txt:/etc/bazntms/ioc.txt:ro
    environment:
      BAZNTMS_DATABASE__PATH: postgres://bazntms:bazntms@timescaledb:5432/bazntms?sslmode=disable
      BAZNTMS_NATS__URL: nats://nats:4222
      BAZNTMS_LOG__FORMAT: json
      AUTH_PASSWORD: demo123
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      timescaledb:
        condition: service_healthy
      nats:
        condition: service_healthy

  # --- ingest filosu: replika ekledikçe yatay ölçeklenir ---
  hub-ingest:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.hub
    command:
      - "-capture=false"
      - "-alerts=false"
      - "-poller=false"
      - "-prune=false" # veritabani bakimi yalnizca hub-controller'da (tek sahip)
      - "-agent-pcap" # agent'lar buraya (lb uzerinden) enroll olur — asil politika burasi
      - "-enroll-token"
      - "scale-enroll-token"
    environment:
      BAZNTMS_DATABASE__PATH: postgres://bazntms:bazntms@timescaledb:5432/bazntms?sslmode=disable
      BAZNTMS_NATS__URL: nats://nats:4222
      BAZNTMS_LOG__FORMAT: json
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      timescaledb:
        condition: service_healthy
      nats:
        condition: service_healthy

  # --- k8s Service karşılığı: :8080 panel havuzu + :8081 agent ingest havuzu ---
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/lb.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080" # panel → hub-controller havuzu (2 replika)
      - "8081:8081" # agent API → hub-ingest havuzu
      # NetFlow/syslog UDP → nginx stream{} → hub-controller havuzu. Docker
      # Desktop for Mac fiziksel LAN'dan gelen UDP'yi published porta İLETMEZ
      # (yalnız 127.0.0.1'den) — bu yüzden loopback'e kaydırılmış portlara
      # bağlanır; deploy/scripts/mac-udp-relay.sh Mac'te gerçek 2055/5514'ü
      # dinleyip buraya iletir. Linux'ta röle gereksiz: bu iki satırı
      # "2055:2055/udp" / "5514:5514/udp" ile değiştirin.
      - "127.0.0.1:12055:2055/udp" # NetFlow v5/v9 · IPFIX · sFlow
      - "127.0.0.1:15514:5514/udp" # syslog (RFC3164)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      hub-ingest:
        condition: service_healthy
      hub-controller:
        condition: service_healthy

  # --- gerçek agent'lar (konteyner içi telemetri; pcap için host net + NET_RAW) ---
  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    command:
      - "-hub-url"
      - "http://lb:8081"
      - "-enroll-token"
      - "scale-enroll-token"
      - "-site"
      - "docker-scale"
      - "-pcap" # surec bazli trafik atfi; hub politikasi (-agent-pcap) da acik olmali
    cap_add:
      - NET_RAW # ham soket + pcap_activate
      - NET_ADMIN # promiscuous mode (SIOCSIFFLAGS) icin NET_RAW yetmiyor
    deploy:
      replicas: 2
    depends_on:
      lb:
        condition: service_healthy

  # --- sentetik filo (opsiyonel: --profile loadgen) ---
  loadgen:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.loadgen
    profiles: ["loadgen"]
    command:
      - "-hub"
      - "http://lb:8081"
      - "-token"
      - "scale-enroll-token"
      - "-agents"
      - "100"
      - "-site"
      - "loadgen-scale"
    depends_on:
      lb:
        condition: service_healthy

volumes:
  tsdata:
  ctldata: # hub-controller /data — vault.key kalıcılığı
